<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUXE — Curated Picks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#08080c;
    --surface:rgba(255,255,255,.035);
    --surface-2:rgba(255,255,255,.06);
    --border:rgba(255,255,255,.08);
    --border-hi:rgba(255,255,255,.18);
    --text:#f4f4f5;
    --text-dim:#a1a1aa;
    --text-dimmer:#6b6b76;
    --grad:linear-gradient(135deg,#6366f1 0%,#a855f7 55%,#ec4899 100%);
    --radius:20px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Inter',system-ui,sans-serif;
    background-color:var(--bg);
    color:var(--text);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -10%,rgba(99,102,241,.18),transparent 60%),
      radial-gradient(ellipse 60% 40% at 90% 90%,rgba(168,85,247,.10),transparent 60%);
    background-attachment:fixed;
    background-repeat:no-repeat;
  }

  /* Header */
  .site-header{
    position:sticky;top:0;z-index:50;
    backdrop-filter:blur(20px) saturate(140%);
    -webkit-backdrop-filter:blur(20px) saturate(140%);
    background:rgba(8,8,12,.6);
    border-bottom:1px solid var(--border);
  }
  .header-inner{
    max-width:1200px;margin:0 auto;padding:16px 24px;
    display:flex;align-items:center;gap:24px;
  }
  .brand{
    font-family:'Space Grotesk',sans-serif;
    font-size:22px;font-weight:700;letter-spacing:-.02em;
    background:var(--grad);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
    text-decoration:none;
  }
  .search{margin-left:auto;position:relative;width:280px}
  .search input{
    width:100%;padding:10px 14px 10px 38px;
    background:var(--surface);border:1px solid var(--border);
    border-radius:12px;color:var(--text);font-size:14px;
    font-family:inherit;outline:none;
    transition:border-color .2s,background .2s;
  }
  .search input:focus{border-color:var(--border-hi);background:var(--surface-2)}
  .search input::placeholder{color:var(--text-dimmer)}
  .search svg{
    position:absolute;left:12px;top:50%;transform:translateY(-50%);
    color:var(--text-dimmer);pointer-events:none;
  }

  /* Hero */
  .hero{max-width:1200px;margin:0 auto;padding:72px 24px 40px;text-align:center}
  .badge{
    display:inline-block;padding:6px 14px;
    background:rgba(139,92,246,.1);border:1px solid rgba(139,92,246,.25);
    border-radius:999px;font-size:12px;font-weight:600;
    color:#c4b5fd;margin-bottom:24px;letter-spacing:.02em;
  }
  .hero h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:clamp(32px,5vw,56px);
    font-weight:700;letter-spacing:-.03em;line-height:1.1;
    margin-bottom:16px;
  }
  .hero h1 .grad{
    background:var(--grad);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  .hero p{color:var(--text-dim);font-size:17px;max-width:520px;margin:0 auto}

  /* Grid */
  .grid-wrap{max-width:1200px;margin:0 auto;padding:24px 24px 80px}
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:24px;
  }

  /* Card */
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    overflow:hidden;
    display:flex;flex-direction:column;
    transition:transform .4s cubic-bezier(.2,.8,.2,1),border-color .3s,box-shadow .4s;
    animation:rise .5s cubic-bezier(.2,.8,.2,1) backwards;
  }
  @keyframes rise{from{opacity:0;transform:translateY(16px)}}
  .card:hover{
    transform:translateY(-6px);
    border-color:var(--border-hi);
    box-shadow:0 24px 48px -16px rgba(99,102,241,.4);
  }
  .thumb{
    position:relative;aspect-ratio:4/3;overflow:hidden;
    background:linear-gradient(135deg,#16161f,#0f0f16);
  }
  .thumb img{
    width:100%;height:100%;object-fit:cover;display:block;
    transition:transform .6s cubic-bezier(.2,.8,.2,1);
  }
  .card:hover .thumb img{transform:scale(1.06)}
  .card-body{padding:18px;display:flex;flex-direction:column;gap:14px;flex:1}
  .card-body h3{font-size:16px;font-weight:600;letter-spacing:-.01em;line-height:1.35}

  .buy-btn{
    margin-top:auto;width:100%;padding:12px 16px;
    display:flex;align-items:center;justify-content:center;gap:8px;
    background:var(--grad);
    border:none;border-radius:12px;
    color:#fff;font-family:inherit;font-size:14px;font-weight:600;
    cursor:pointer;
    transition:filter .2s,transform .15s,box-shadow .3s;
    box-shadow:0 8px 24px -8px rgba(99,102,241,.6);
  }
  .buy-btn:hover{filter:brightness(1.1);box-shadow:0 12px 32px -8px rgba(168,85,247,.7)}
  .buy-btn:active{transform:scale(.98)}
  .buy-btn svg{transition:transform .3s}
  .card.open .buy-btn svg{transform:rotate(180deg)}

  /* Platform menu */
  .platforms{
    max-height:0;overflow:hidden;
    transition:max-height .35s cubic-bezier(.2,.8,.2,1);
  }
  .platforms.open{max-height:400px}
  .platforms-inner{display:flex;flex-direction:column;gap:6px;padding-top:6px}
  .platform{
    display:flex;align-items:center;gap:10px;
    padding:10px 12px;
    background:rgba(255,255,255,.03);
    border:1px solid var(--border);
    border-radius:10px;
    color:var(--text);text-decoration:none;
    font-size:13px;font-weight:500;
    transition:background .2s,border-color .2s,transform .2s;
  }
  .platform:hover{
    background:rgba(255,255,255,.07);
    border-color:var(--border-hi);
    transform:translateX(2px);
  }
  .platform .dot{
    width:8px;height:8px;border-radius:50%;flex-shrink:0;
    box-shadow:0 0 8px currentColor;
  }
  .platform .name{flex:1}
  .platform svg{color:var(--text-dimmer);transition:color .2s,transform .2s}
  .platform:hover svg{color:var(--text);transform:translate(1px,-1px)}

  /* Empty state */
  .empty{display:none;text-align:center;padding:80px 24px;color:var(--text-dim)}
  .empty svg{opacity:.3;margin-bottom:16px}
  .empty h3{font-size:20px;font-weight:600;color:var(--text);margin-bottom:8px}
  .empty p{font-size:14px}

  footer{
    text-align:center;padding:40px 24px;
    border-top:1px solid var(--border);
    color:var(--text-dimmer);font-size:13px;
  }

  @media (max-width:640px){
    .search{width:150px}
    .hero{padding:48px 20px 24px}
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="#" class="brand">LUXE</a>
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
      <input type="text" id="search" placeholder="Search products...">
    </div>
  </div>
</header>

<section class="hero">
  <div class="badge">✦ Hand-picked finds</div>
  <h1>Discover <span class="grad">products</span><br>worth your attention</h1>
  <p>Curated recommendations with the best prices from your favorite platforms.</p>
</section>

<main class="grid-wrap">
  <div id="product-list" class="grid"></div>
  <div id="empty" class="empty">
    <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 01-8 0"/></svg>
    <h3>Nothing here yet</h3>
    <p>Add products through the admin panel to see them here.</p>
  </div>
</main>

<footer>© <span id="year"></span> LUXE · Curated with care</footer>

<script>
  const STORAGE_KEY = 'myProducts';

  const PLATFORM_COLORS = {
    amazon:'#ff9900', flipkart:'#2874f0', ebay:'#e53238', walmart:'#0071dc',
    etsy:'#f1641e', myntra:'#ff3f6c', ajio:'#2c4152', meesho:'#f43397',
    snapdeal:'#e40046', shopify:'#95bf47'
  };
  const FALLBACK = ['#6366f1','#a855f7','#ec4899','#06b6d4','#10b981','#f59e0b'];

  const esc = s => String(s ?? '').replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function colorFor(name, i){
    const k = String(name).trim().toLowerCase();
    return PLATFORM_COLORS[k] || FALLBACK[i % FALLBACK.length];
  }

  const grid = document.getElementById('product-list');
  const emptyEl = document.getElementById('empty');
  const searchInput = document.getElementById('search');
  document.getElementById('year').textContent = new Date().getFullYear();

  function render(){
    const products = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    const q = searchInput.value.trim().toLowerCase();
    const list = q ? products.filter(p => p.name.toLowerCase().includes(q)) : products;

    grid.innerHTML = '';

    if (list.length === 0){
      emptyEl.style.display = 'block';
      grid.style.display = 'none';
      return;
    }
    emptyEl.style.display = 'none';
    grid.style.display = 'grid';

    list.forEach((product, idx) => {
      const card = document.createElement('article');
      card.className = 'card';
      card.style.animationDelay = (idx * 60) + 'ms';

      const platformsHtml = product.links.map((link, i) => {
        const c = colorFor(link.platform, i);
        return `
          <a class="platform" href="${esc(link.url)}" target="_blank" rel="noopener">
            <span class="dot" style="background:${c};color:${c}"></span>
            <span class="name">${esc(link.platform)}</span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M17 7H8M17 7v9"/></svg>
          </a>`;
      }).join('');

      card.innerHTML = `
        <div class="thumb">
          <img src="${esc(product.image)}" alt="${esc(product.name)}" loading="lazy" onerror="this.style.display='none'">
        </div>
        <div class="card-body">
          <h3>${esc(product.name)}</h3>
          <button class="buy-btn" type="button">
            <span>Go Buy</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div class="platforms"><div class="platforms-inner">${platformsHtml}</div></div>
        </div>`;

      const btn = card.querySelector('.buy-btn');
      const menu = card.querySelector('.platforms');
      btn.addEventListener('click', e => {
        e.stopPropagation();
        document.querySelectorAll('.card.open').forEach(c => {
          if (c !== card){
            c.classList.remove('open');
            c.querySelector('.platforms').classList.remove('open');
          }
        });
        card.classList.toggle('open');
        menu.classList.toggle('open');
      });

      grid.appendChild(card);
    });
  }

  document.addEventListener('click', () => {
    document.querySelectorAll('.card.open').forEach(c => {
      c.classList.remove('open');
      c.querySelector('.platforms').classList.remove('open');
    });
  });

  searchInput.addEventListener('input', render);
  render();
</script>
</body>
</html>
